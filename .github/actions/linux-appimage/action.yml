# Путь сборки и приёмки AppImage для Release; локально те же шаги выполняет скилл songframe-build.
name: Linux AppImage
description: Собрать и проверить конечный AppImage с внешней тестовой моделью
inputs:
  report-dir:
    description: Каталог журналов и временного проекта
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: |
          build/runtime/downloads
          build/runtime/smoke-model
        key: linux-runtime-${{ hashFiles('scripts/runtime/*lock*') }}
    - name: Zstd для уведомлений CPython
      shell: bash
      # В образе ubuntu-24.04 zstd обычно уже есть: apt-get update только при его отсутствии.
      run: |
        command -v zstd || { sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd; }
    - name: Собрать AppImage с ресурсами
      shell: bash
      run: yarn dist:linux --publish never
    - name: Проверить переносимый Python
      shell: bash
      run: yarn smoke:runtime
    - name: Подготовить внешнюю модель только для проверки
      shell: bash
      run: yarn prepare:smoke-model
    # Тег совпадает с вычисляемым в smoke-appimage.mjs: найденный образ скрипт не пересобирает.
    - name: Тег проверочного образа
      id: smoke-image
      shell: bash
      run: echo "tag=songframe-smoke:$(sha256sum scripts/runtime/linux-smoke.Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v4
    - name: Проверочный образ Ubuntu 22.04 из кэша
      uses: docker/build-push-action@v7
      with:
        context: scripts/runtime
        file: scripts/runtime/linux-smoke.Dockerfile
        tags: ${{ steps.smoke-image.outputs.tag }}
        load: true
        cache-from: type=gha,scope=songframe-smoke
        cache-to: type=gha,scope=songframe-smoke,mode=max
    - name: Проверить AppImage в чистом Linux без сети
      shell: bash
      env:
        SONGFRAME_REPORT_DIR: ${{ inputs.report-dir }}
      run: yarn smoke:appimage --docker --model="$GITHUB_WORKSPACE/build/runtime/smoke-model" --output="$SONGFRAME_REPORT_DIR"
