# Упаковка из Linux: AppImage и Windows-установщик NSIS, результат в build/release.
appId: tools.songframe.app
productName: SongFrame
# Имена артефактов без пробелов: удобнее прикреплять к релизу и скачивать.
artifactName: songframe-${version}-${os}-${arch}.${ext}
directories:
  output: build/release
  buildResources: resources
files:
  - build/app/**
  - package.json
asar: true
beforePack: scripts/runtime/before-pack.cjs
afterPack: scripts/runtime/after-pack.cjs
extraResources:
  # Окно использует тот же рисунок, что и ярлык; путь вычисляется от resourcesPath.
  - from: resources/icon.png
    to: icon.png
  - from: README.md
    to: README.md
  - from: tools
    to: tools
    filter:
      - '**/*'
      - '!**/test_*.py'
      - '!testdata/**'
      # Тестовый провайдер медиа и помощники тестов в поставку не входят.
      - '!testing/**'
      - '!run_tests/**'
      - '!**/__pycache__/**'
  # Промпты заданий агента: главный процесс вкладывает их в задания сценария и производства.
  - from: skills
    to: skills
    filter:
      - '**/*.md'
  # Документы провайдеров: раздел «Указания агенту» выбранного провайдера вкладывается в промпт производства.
  - from: docs/providers
    to: docs/providers
    filter:
      - '**/*.md'
  - from: templates/project
    to: templates/project
linux:
  icon: resources/icon.png
  # Имя desktop-файла и app_id Electron совпадают, чтобы окно получало правильную иконку.
  syncDesktopName: true
  extraResources:
    - from: build/runtime/linux-${arch}
      to: runtime
      # Веса устанавливаются отдельно и не попадают в AppImage даже из старого локального runtime.
      filter:
        - '**/*'
        - '!models{,/**}'
  target:
    - AppImage
  category: AudioVideo
win:
  icon: resources/icon.ico
  # resedit в electron-builder меняет иконку и метаданные PE прямо на Linux, без запуска EXE.
  signAndEditExecutable: true
  signExecutable: false
  extraFiles:
    - from: scripts/runtime/windows
      to: .
  extraResources:
    - from: build/runtime/win32-${arch}
      to: runtime
      filter:
        - '**/*'
        - '!models{,/**}'
  target:
    - nsis
# Установка в профиль пользователя (%LOCALAPPDATA%\Programs) без прав администратора:
# check-runtime.cmd пишет отчёты в папку установки, она должна быть доступна на запись.
nsis:
  artifactName: songframe-${version}-win-${arch}-setup.${ext}
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  # Настройки, история и вход в провайдеров переживают удаление и переустановку.
  deleteAppDataOnUninstall: false
  # Только русские сообщения установщика; 1049 — русский LCID метаданных версии.
  installerLanguages:
    - ru_RU
  language: '1049'
npmRebuild: false
