# CI выбирает проверки в два этапа:
# 1. scope читает событие GitHub и вычисляет независимые флаги проверок.
# 2. Остальные jobs/steps выполняются только при соответствующем флаге true.
# Сами группы и известные потребители описаны в scripts/ci/README.md;
# код выбора и его регрессии — scripts/ci/classify-changes*.mjs.
# При добавлении группы обновить вместе: CI_FLAGS, inputs, outputs, условия jobs и тесты.
# Поставки здесь не собираются: их собирают и проверяют локально, выпуск — `yarn release`. @link ../../docs/development.md#выпуск-релиза
name: CI
# Имя ручного запуска — часть контракта scripts/release/release.mjs.
# Только manual/all может подтвердить исходники перед релизом; manual/auto и
# manual/selected могут проверить лишь часть проекта. Не переименовывать marker
# без изменения ciState и его тестов. Автоматические запуски сохраняют название события.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      format('CI · manual/{0}', inputs.mode == 'Полный набор' && 'all' || inputs.mode == 'Автоматически (последний коммит)' && 'auto' || 'selected') ||
      github.event.pull_request.title || github.event.head_commit.message || 'CI' }}

# Раннер запускается только при изменении файлов, которые читают lint, format, typecheck и тесты.
# `*.md` без папки — только корневые документы; README инструментов, шаблона и промпты скиллов остаются под CI.
on:
  pull_request:
    paths: &checked-paths
      - '**'
      - '!*.md'
      - '!LICENSE'
      - '!docs/**'
      # Документы провайдеров вкладываются в промпт задания, их проверяет provider-guides.test.ts.
      - 'docs/providers/**'
      - '!dev-skills/**'
      - '!.claude/**'
      - '!.agents/**'
      - '!.vscode/**'
      - '!www/**'
  push:
    branches: [main]
    paths: *checked-paths
  # Ручной запуск доступен в Actions → CI → Run workflow.
  # auto: первый родитель → последний коммит выбранной ветки/тега, как указано в подписи.
  # selected: ровно отмеченные ниже группы; пустой выбор — ошибка, а не полный набор.
  # all: все группы; нужен для ручного подтверждения исходников перед выпуском.
  # Флажки используются только в selected. Auto/all их намеренно игнорируют.
  # В GitHub нет множественного choice: режим — список, группы — отдельные boolean-флажки.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим. Флажки ниже действуют только для «Выбранные группы».'
        type: choice
        required: true
        default: 'Автоматически (последний коммит)'
        options:
          - 'Автоматически (последний коммит)'
          - 'Выбранные группы'
          - 'Полный набор'
      # Эти ID должны совпадать с CI_FLAGS в classify-changes.mjs.
      # Общие routing-тесты scope выполняются всегда; workflow добавляет статическую проверку CI.
      workflow:
        description: 'Workflow: actionlint и стиль скриптов CI'
        type: boolean
        default: false
      quality:
        description: 'ESLint и Prettier проекта'
        type: boolean
        default: false
      types:
        description: 'Типизация приложения и историй'
        type: boolean
        default: false
      # При ручном выборе Node/Python проверяется весь набор соответствующего языка.
      # Автоматический режим дополнительно умеет выбирать конкретные тесты по потребителям.
      node:
        description: 'Node: все тесты приложения'
        type: boolean
        default: false
      build:
        description: 'Сборка приложения'
        type: boolean
        default: false
      browser:
        description: 'Storybook: сборка и браузерные проверки'
        type: boolean
        default: false
      python:
        description: 'Python: все наборы инструментов'
        type: boolean
        default: false
      runtime:
        description: 'Runtime: тесты скриптов поставки'
        type: boolean
        default: false
      release:
        description: 'Тесты инструмента выпуска'
        type: boolean
        default: false

# Push/PR одной ветки заменяет устаревший автоматический запуск.
# Ручной запуск имеет отдельный run_id: не прерывает ни автоматическую проверку
# исходников, ни другой ручной запуск (в том числе полный перед релизом).
concurrency:
  # Частичная ручная проверка не отменяет push/PR и другие ручные запуски.
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Служебный job работает при любом запуске: проверяет алгоритм маршрутизации
  # и публикует план. Он не запускает тесты приложения, сборку или Python-инструменты.
  scope:
    name: 'Выбор проверок'
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNS_ON || '"ubuntu-24.04"') }}
    # В outputs GitHub хранит строки: ниже сравниваем с 'true', а не с truthiness.
    # node_tests/python_tests — JSON: [] при выключенной группе, null для всех
    # тестов языка, массив для адресного списка. node_media — отдельная подготовка
    # Python/FFmpeg для Node-интеграций; это не запуск Python-наборов.
    outputs:
      workflow: ${{ steps.scope.outputs.workflow }}
      quality: ${{ steps.scope.outputs.quality }}
      types: ${{ steps.scope.outputs.types }}
      node: ${{ steps.scope.outputs.node }}
      build: ${{ steps.scope.outputs.build }}
      browser: ${{ steps.scope.outputs.browser }}
      python: ${{ steps.scope.outputs.python }}
      runtime: ${{ steps.scope.outputs.runtime }}
      release: ${{ steps.scope.outputs.release }}
      node_media: ${{ steps.scope.outputs.node_media }}
      node_tests: ${{ steps.scope.outputs.node_tests }}
      python_tests: ${{ steps.scope.outputs.python_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          # PR требует merge-base, push может содержать несколько коммитов.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Это короткие тесты самого CI на временных Git-репозиториях, без приложения.
      - name: Проверки выбора набора
        run: node --test scripts/ci/classify-changes.test.mjs
      - name: Изменённые области
        id: scope
        run: node scripts/ci/classify-changes.mjs

  # Изменения .github/workflows/** и scripts/ci/** сами выбирают только этот job.
  # Если diff также меняет приложение/инструменты, scope объединяет нужные флаги.
  workflow:
    name: 'Workflow и маршрутизация: статические проверки'
    needs: scope
    if: needs.scope.outputs.workflow == 'true'
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v7
      - name: Проверка GitHub Actions через actionlint
        run: |
          # Проверяются все workflow, включая Pages; поставки и приложение не собираются.
          # При обновлении actionlint менять одновременно версию URL и SHA-256
          # из официального релиза rhysd/actionlint, затем проверить локальный запуск.
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: TLS для Node
        run: echo "OPENSSL_CONF=$GITHUB_WORKSPACE/scripts/ci/node-openssl.cnf" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Yarn 4 через corepack
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      # Линтерам нужны только JS-пакеты. skip-build запрещает root postinstall
      # и загрузку бинарника Electron; это не установка окружения приложения.
      - name: Зависимости линтеров без postinstall
        run: yarn install --immutable --mode=skip-build
      - name: ESLint скриптов CI
        run: yarn eslint scripts/ci/*.mjs --max-warnings 0
      - name: Формат workflow и скриптов CI
        run: yarn prettier --check '.github/workflows/*.{yml,yaml}' scripts/ci/*.mjs

  # Общая Node-среда экономит повторную установку зависимостей.
  # Наличие job не означает запуск всего приложения: каждый шаг имеет свой if.
  # Например, quality-only выполнит только ESLint/Prettier, без types/tests/build/browser.
  app:
    name: 'Node: выбранные проверки'
    needs: scope
    if: >-
      needs.scope.outputs.quality == 'true' || needs.scope.outputs.types == 'true' ||
      needs.scope.outputs.node == 'true' || needs.scope.outputs.build == 'true' ||
      needs.scope.outputs.browser == 'true'
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v7
      - name: TLS для Node
        run: echo "OPENSSL_CONF=$GITHUB_WORKSPACE/scripts/ci/node-openssl.cnf" >> "$GITHUB_ENV"
      - name: Node.js для Corepack
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Yarn 4 через corepack
        run: corepack enable
      - name: Кэш Yarn
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: actions/cache@v6
        if: needs.scope.outputs.node_media == 'true' || needs.scope.outputs.build == 'true' || needs.scope.outputs.browser == 'true'
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: electron-${{ runner.os }}-
      # Бинарные зависимости нужны сборке/витрине и настоящим межъязыковым тестам.
      # Для чистого линтинга, типов и лёгких Node-тестов install-скрипты выключены.
      - name: Зависимости
        env:
          NEED_BUILD_SCRIPTS: ${{ needs.scope.outputs.node_media == 'true' || needs.scope.outputs.build == 'true' || needs.scope.outputs.browser == 'true' }}
        run: |
          if [ "$NEED_BUILD_SCRIPTS" = true ]; then
            yarn install --immutable
          else
            yarn install --immutable --mode=skip-build
          fi
      - name: ESLint
        if: needs.scope.outputs.quality == 'true'
        run: yarn lint
      - name: Prettier
        if: needs.scope.outputs.quality == 'true'
        run: yarn format:check
      - name: Типизация
        if: needs.scope.outputs.types == 'true'
        run: yarn typecheck
      - uses: actions/setup-python@v7
        if: needs.scope.outputs.node_media == 'true'
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        if: needs.scope.outputs.node_media == 'true'
        with:
          path: ${{ runner.temp }}/songframe-ci-ffmpeg/ffmpeg.tar.xz
          key: ci-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/runtime/media-lock.json') }}
      # Python/FFmpeg нужны только реальным межъязыковым тестам; чистые Node-тесты читают файлы без этой подготовки.
      - name: FFmpeg и Pillow для интеграционных тестов
        if: needs.scope.outputs.node_media == 'true'
        run: |
          bash tools/run_tests/prepare_ci_media.sh
          python -m pip install pillow==13.0.0 numpy==2.5.4
          python -c "from PIL import features; raise SystemExit(not features.check('raqm'))" || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libfribidi0; }
          python -c "from PIL import features; assert features.check('raqm'), 'Pillow без Raqm: нет libfribidi'"
      # Список приходит как JSON, не как shell-команда: имена передаются spawnSync
      # отдельными аргументами. null означает весь Vitest; пустой включённый набор — ошибка.
      - name: Выбранные тесты Node
        if: needs.scope.outputs.node == 'true'
        env:
          CI_NODE_TESTS: ${{ needs.scope.outputs.node_tests }}
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const selected = JSON.parse(process.env.CI_NODE_TESTS);
          if (selected !== null && (!Array.isArray(selected) || selected.length === 0)) throw new Error('Пустой набор Node не является проверкой.');
          const result = spawnSync('yarn', ['test', ...(selected ?? [])], { stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          JS
      - name: Сборка приложения
        if: needs.scope.outputs.build == 'true'
        run: yarn build
      # Browser — самостоятельная группа: сборка витрины, Chromium и Playwright.
      # Она не требует запуска обычного Vitest или Python, если их флаги выключены.
      - name: Статическая витрина Storybook
        if: needs.scope.outputs.browser == 'true'
        run: yarn build-storybook
      - uses: actions/cache@v6
        if: needs.scope.outputs.browser == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
      - name: Chromium для браузерного набора
        if: needs.scope.outputs.browser == 'true'
        run: |
          yarn playwright install --only-shell chromium
          node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())" || yarn playwright install-deps chromium
      - name: Браузерный набор витрины
        if: needs.scope.outputs.browser == 'true'
        id: storybook-browser
        run: yarn test:storybook
      - name: Отчёт браузерного набора
        if: failure() && needs.scope.outputs.browser == 'true' && steps.storybook-browser.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: storybook-browser-report
          path: build/storybook-test/
          if-no-files-found: ignore
          retention-days: 14

  # Python-наборы отделены от Node, runtime и выпуска.
  # Автоматический план выбирает предметную группу/модули; ручной python — весь набор.
  tools:
    name: 'Python: выбранные наборы'
    needs: scope
    if: needs.scope.outputs.python == 'true'
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/songframe-ci-ffmpeg/ffmpeg.tar.xz
          key: ci-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/runtime/media-lock.json') }}
      - name: FFmpeg и Pillow для медиатестов
        run: |
          bash tools/run_tests/prepare_ci_media.sh
          python -m pip install pillow==13.0.0 numpy==2.5.4
          python -c "from PIL import features; raise SystemExit(not features.check('raqm'))" || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libfribidi0; }
          python -c "from PIL import features; assert features.check('raqm'), 'Pillow без Raqm: нет libfribidi'"
      # --only получает только выбранные имена. null убирает --only и запускает всё.
      # Число процессов ограничиваем квотой контейнера: CPU хоста может быть больше.
      # Каждый набор использует временную тестовую копию, а не пользовательский проект.
      - name: Выбранные тесты Python
        env:
          CI_PYTHON_TESTS: ${{ needs.scope.outputs.python_tests }}
        run: |
          python3 -B - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          selected = json.loads(os.environ['CI_PYTHON_TESTS'])
          if selected is not None and (not isinstance(selected, list) or not selected):
              raise ValueError('Пустой набор Python не является проверкой.')
          jobs = os.cpu_count() or 1
          try:
              quota, period = Path('/sys/fs/cgroup/cpu.max').read_text().split()
              if quota != 'max':
                  jobs = max(1, int(quota) // int(period))
          except (OSError, ValueError):
              pass
          args = [] if selected is None else ['--only', *selected]
          raise SystemExit(subprocess.call([sys.executable, '-B', 'tools/run_tests/run_tests.py', *args, '--jobs', str(jobs)]))
          PY

  # Только unit-тесты скриптов поставки и синтаксис Python.
  # Здесь нет dist:linux/dist:win, Docker-smoke или нативного запуска Windows.
  runtime:
    name: 'Скрипты поставки: Node и Python'
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Тесты Node-скриптов поставки
        run: node --test scripts/runtime/*.test.mjs
      - name: Синтаксис Python-скриптов поставки
        run: |
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('scripts/runtime').glob('*.py'):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY
      - name: Тесты проверки установщика
        run: python3 -B -m unittest discover -s scripts/runtime -p 'test_*.py'

  # Проверяется инструмент публикации на fake GitHub и маленьких временных Git-репозиториях.
  # Настоящий release prepare/publish этот job не вызывает; сборки и отправки файлов нет.
  release:
    name: 'Инструмент выпуска: тесты'
    needs: scope
    if: needs.scope.outputs.release == 'true'
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Проверки сценария выпуска
        run: node --test scripts/release/release.test.mjs
