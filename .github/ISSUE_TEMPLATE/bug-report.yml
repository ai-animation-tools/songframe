name: Сообщить об ошибке
description: Ошибка в SongFrame, производстве клипа или установке компонентов.
title: '[Ошибка] '
body:
  - type: dropdown
    id: operating-system
    attributes:
      label: Операционная система
      options:
        - Windows
        - Linux
        - Другая
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Версия ОС
      description: Для Linux укажите название и версию дистрибутива.
      placeholder: 'Например: Windows 11 24H2, Ubuntu 24.04'
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Архитектура системы
      options:
        - x64 (Intel / AMD)
        - arm64 (ARM)
        - Другая
        - Не знаю
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Версия приложения
      description: >-
        Укажите версию из имени скачанного файла: songframe-go-ВЕРСИЯ-linux-x86_64.AppImage
        или songframe-go-ВЕРСИЯ-win-x64-setup.exe. Для сборки из исходников
        укажите commit или тег.
      placeholder: 'Например: 1.0.0-dev.47 или commit исходников'
    validations:
      required: true

  - type: dropdown
    id: launch-method
    attributes:
      label: Как запущено приложение
      options:
        - AppImage (Linux)
        - Через установщик Windows
        - Собственная сборка из исходников (wails3 task build)
        - Другое
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Опишите действия по порядку, начиная с запуска приложения.
      placeholder: |
        1. Запускаю приложение и открываю…
        2. Нажимаю…
        3. Получаю ошибку…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
      placeholder: Что должно было произойти?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
      description: Если появилось сообщение об ошибке, приведите его точный текст.
      placeholder: Что произошло вместо ожидаемого результата?
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Как часто повторяется ошибка
      options:
        - При каждом повторении этих действий
        - Иногда
        - Случилось один раз, повторить не удалось
        - Пока не проверял повторно

  - type: textarea
    id: context
    attributes:
      label: Дополнительные условия
      description: Заполните только то, что относится к вашей ошибке.
      placeholder: |
        Этап: исходники трека, тайминги, сценарий, генерация, монтаж или аниматик; код плана Mxx, если есть.
        Агент или медиа: провайдер и модель, если относятся к ошибке.
        Компоненты: FFmpeg, ONNX Runtime или модели и их состояние на странице «Компоненты».
        Linux: рабочий стол и Wayland / X11; появлялся ли запрос настройки AppArmor при запуске.
        Windows: установлен ли WebView2, если окно не открывается.
        Собственная сборка: команда сборки и версии Go, Wails CLI, Node.
        Другие настройки, влияющие на ошибку. Не добавляйте токены и данные входа.

  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика и журнал
      description: >-
        Укажите ошибки на страницах «Среда» и «Компоненты». На странице «Журнал заданий»
        нажмите «Сохранить отчёт для разработчика» и приложите файл ниже.
        Если окно не открывается, приложите журнал приложения logs/app.log из папки
        состояния: в Linux ~/.config/songframe-desktop, в Windows %APPDATA%\songframe-desktop
        (или папка из SONGFRAME_GO_LOCAL_DIR, если она задана).
        Можно добавить точный текст ошибки или фрагмент журнала без токенов,
        данных входа и личных путей.
      placeholder: Результаты диагностики, код ошибки или фрагмент журнала.
      render: text

  - type: textarea
    id: attachments
    attributes:
      label: Скриншоты и файлы
      description: >-
        Перетащите сюда скриншоты, короткую запись экрана, отчёт или файл журнала,
        если они помогают показать ошибку. Можно приложить минимальный пример
        исходников проекта без секретов. Скройте данные аккаунта и личные пути.
