# Release проверяет готовую Windows-поставку без запуска Windows-кода.
name: Windows ZIP
description: Собрать Windows ZIP на Linux и проверить архив и обязательные ресурсы
inputs:
  version:
    description: Ожидаемая версия ZIP; по умолчанию берётся из package.json
    required: false
outputs:
  zip:
    description: Путь проверенного Windows ZIP
    value: ${{ steps.archive.outputs.zip }}
  sha256:
    description: Путь SHA256 проверенного ZIP
    value: ${{ steps.archive.outputs.sha256 }}
  report:
    description: Отчёт проверки архива без нативного исполнения
    value: ${{ steps.archive.outputs.report }}
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: build/runtime/downloads
        # Загрузки зависят только от закреплённых версий runtime и FFmpeg, не от зависимостей Node.
        key: windows-runtime-${{ hashFiles('scripts/runtime/*lock*') }}
    - name: Тесты проверки Windows ZIP
      shell: bash
      run: python3 -B -m unittest discover -s scripts/runtime -p test_check_windows_zip.py
    - name: Собрать Windows ZIP с ресурсами
      shell: bash
      run: yarn dist:win --publish never
    - name: Проверить готовый Windows ZIP
      id: archive
      shell: bash
      env:
        SONGFRAME_EXPECTED_VERSION: ${{ inputs.version }}
      run: |
        version="${SONGFRAME_EXPECTED_VERSION:-$(node -p 'require("./package.json").version')}"
        zip="build/release/songframe-${version}-win-x64.zip"
        python3 -B scripts/runtime/check-windows-zip.py "$zip" --version "$version"
        echo "zip=$zip" >> "$GITHUB_OUTPUT"
        echo "sha256=$zip.sha256" >> "$GITHUB_OUTPUT"
        echo "report=build/release/windows-archive-check.json" >> "$GITHUB_OUTPUT"
