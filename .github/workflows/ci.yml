# Проверки кода приложения и инструментов: на pull request и при слиянии в main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: 'Приложение: lint, format, typecheck, тесты'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Сначала выбираем Node из проекта: Yarn нужен уже при вычислении пути кэша.
      # Повторный setup-node только подключает кэш после подготовки Corepack. @link .nvmrc
      - name: Node.js для Corepack
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Yarn 4 через corepack
        run: |
          corepack enable
          node --version
          corepack --version
          yarn --version
      - name: Кэш Yarn
        uses: actions/setup-node@v7
        with:
          # Версия совпадает с окружением разработчика. @link .nvmrc
          node-version-file: .nvmrc
          cache: yarn
      - name: Зависимости
        run: yarn install --immutable
      - name: ESLint
        run: yarn lint
      - name: Prettier
        run: yarn format:check
      - name: Проверки сценария выпуска
        run: node --test scripts/release/release.test.mjs
      - name: Типизация
        run: yarn typecheck
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Общий архив проверяется по media-lock.json при каждом восстановлении, бинарники остаются в runner.temp.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/songframe-ci-ffmpeg/ffmpeg.tar.xz
          key: ci-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/runtime/media-lock.json') }}
      # Тесты создают карточки и экспортируют монтаж с настоящим FFmpeg. @link src/main/montage-integration.test.ts
      - name: FFmpeg и Pillow для интеграционных тестов приложения
        run: |
          bash tools/run_tests/prepare_ci_media.sh
          python -m pip install pillow==13.0.0
      - name: Тесты главного процесса
        run: yarn test

  tools:
    name: 'Инструменты Python: тесты'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/songframe-ci-ffmpeg/ffmpeg.tar.xz
          key: ci-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/runtime/media-lock.json') }}
      - name: FFmpeg и Pillow для медиатестов
        run: |
          bash tools/run_tests/prepare_ci_media.sh
          python -m pip install pillow==13.0.0
      - name: Тесты
        run: python3 -B tools/run_tests/run_tests.py

  runtime:
    name: 'Linux: сборка и проверка runtime'
    runs-on: ubuntu-24.04
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      # Сначала выбираем Node из проекта: Yarn нужен уже при вычислении пути кэша.
      # Повторный setup-node только подключает кэш после подготовки Corepack. @link .nvmrc
      - name: Node.js для Corepack
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Yarn 4 через corepack
        run: |
          corepack enable
          node --version
          corepack --version
          yarn --version
      - name: Кэш Yarn
        uses: actions/setup-node@v7
        with:
          # Сборка использует ту же версию Node.js, что и проверки приложения.
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - name: Собрать и проверить конечный AppImage
        uses: ./.github/actions/linux-appimage
        with:
          report-dir: ${{ runner.temp }}/songframe-appimage
      - name: Журналы приёмки
        # После отмены не загружаем временный проект и журналы тяжёлой проверки.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage-smoke
          path: ${{ runner.temp }}/songframe-appimage
          if-no-files-found: ignore
      - name: Проверенный Linux AppImage
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: |
            build/release/*.AppImage
            build/release/*.AppImage.sha256
            build/release/linux-distribution.json
            build/release/linux-smoke-result.json
            build/release/THIRD_PARTY_LICENSES.md
          if-no-files-found: error

  windows:
    name: 'Windows: сборка ZIP и проверка архива на Linux'
    runs-on: ubuntu-24.04
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      # Yarn нужен уже при подключении кэша; Node выбирается из настроек проекта.
      - name: Node.js для Corepack
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Yarn 4 через corepack
        run: |
          corepack enable
          node --version
          corepack --version
          yarn --version
      - name: Кэш Yarn
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - name: Собрать и проверить конечный Windows ZIP
        id: windows
        uses: ./.github/actions/windows-zip
      - name: Проверенный Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: |
            ${{ steps.windows.outputs.zip }}
            ${{ steps.windows.outputs.sha256 }}
            ${{ steps.windows.outputs.report }}
          if-no-files-found: error
