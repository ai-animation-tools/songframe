# Сверка документации с репозиторием: ссылки и якоря, пути, переменные SONGFRAME_*, задачи
# Taskfile, скрипты yarn и актуальность карты кода docs/code-map.md (internal/repodocs).
# Основной CI не запускается на изменения только документации, поэтому эта проверка — отдельный
# лёгкий workflow на любые изменения: пакету repodocs не нужны CGO, GTK и Node.
name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    name: 'Документация и карта кода'
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Версия Go из go.mod
        id: go-version
        shell: bash
        run: echo "minor=$(sed -n 's/^go \([0-9]*\.[0-9]*\).*/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go-version.outputs.minor }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Сверка документации
        run: go test ./internal/repodocs -count=1
