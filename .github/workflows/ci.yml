# Проверки кода приложения и инструментов: на pull request и при слиянии в main.
# Поставки здесь не собираются: их проверяют локально, а для релиза собирает release.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: 'Приложение: lint, format, typecheck, тесты'
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v7
      # Сначала выбираем Node из проекта: Yarn нужен уже при вычислении пути кэша.
      # Повторный setup-node только подключает кэш после подготовки Corepack. @link .nvmrc
      - name: Node.js для Corepack
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Yarn 4 через corepack
        run: |
          corepack enable
          node --version
          corepack --version
          yarn --version
      - name: Кэш Yarn
        uses: actions/setup-node@v7
        with:
          # Версия совпадает с окружением разработчика. @link .nvmrc
          node-version-file: .nvmrc
          cache: yarn
      # postinstall скачивает Electron (~100 МБ); кэш по yarn.lock избавляет от повторной загрузки.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: electron-${{ runner.os }}-
      - name: Зависимости
        run: yarn install --immutable
      - name: ESLint
        run: yarn lint
      - name: Prettier
        run: yarn format:check
      - name: Проверки сценария выпуска
        run: node --test scripts/release/release.test.mjs
      - name: Типизация
        run: yarn typecheck
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Общий архив проверяется по media-lock.json при каждом восстановлении, бинарники остаются в runner.temp.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/songframe-ci-ffmpeg/ffmpeg.tar.xz
          key: ci-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/runtime/media-lock.json') }}
      # Тесты создают карточки и экспортируют монтаж с настоящим FFmpeg. @link src/main/montage-integration.test.ts
      - name: FFmpeg и Pillow для интеграционных тестов приложения
        run: |
          bash tools/run_tests/prepare_ci_media.sh
          python -m pip install pillow==13.0.0
      - name: Тесты приложения
        run: yarn test
      - name: Сборка приложения
        run: yarn build
      # Витрина собирается из отслеживаемых фикстур без Python/runtime и рабочего проекта.
      - name: Статическая витрина Storybook
        run: yarn build-storybook
      # Версия Chromium определяется @playwright/test из yarn.lock; ставится только headless shell.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
      # В образе контейнера раннера системных библиотек браузера может не быть: apt-get только при неудачном пробном запуске.
      - name: Chromium для браузерного набора
        run: |
          yarn playwright install --only-shell chromium
          node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())" || yarn playwright install-deps chromium
      # Истории с меткой ci: play, ошибки выполнения и загрузки, обязательные правила WCAG A/AA. @link tests/storybook/stories.spec.ts
      - name: Браузерный набор витрины
        id: storybook-browser
        run: yarn test:storybook
      - name: Отчёт браузерного набора
        if: failure() && steps.storybook-browser.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: storybook-browser-report
          path: build/storybook-test/
          if-no-files-found: ignore
          retention-days: 14

  tools:
    name: 'Инструменты Python: тесты'
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/songframe-ci-ffmpeg/ffmpeg.tar.xz
          key: ci-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/runtime/media-lock.json') }}
      - name: FFmpeg и Pillow для медиатестов
        run: |
          bash tools/run_tests/prepare_ci_media.sh
          python -m pip install pillow==13.0.0
      # Наборы независимы (у каждого процесса своя копия образца) и идут параллельно по числу ядер раннера.
      - name: Тесты
        run: python3 -B tools/run_tests/run_tests.py --jobs "$(nproc)"
      - name: Тесты скриптов поставки
        run: python3 -B -m unittest discover -s scripts/runtime -p 'test_*.py'
