# Лэндинг из www публикуется на GitHub Pages как есть, без сборки.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Публикации идут по очереди; начатую не прерываем, чтобы сайт не остался наполовину обновлённым.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Публикация лэндинга
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Артефакт сайта весит сотни килобайт и живёт один день: квоту хранилища Actions он не расходует заметно.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: www
          retention-days: 1
      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
